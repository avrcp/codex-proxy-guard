[workspace]
members = [
    "crates/proxy-guard-core",
    "crates/proxy-guard-network",
    "crates/proxy-guard-windows",
    "crates/proxy-guard-app",
]
resolver = "2"

[workspace.package]
version = "0.5.0-rc.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/avrcp/codex-proxy-guard"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
percent-encoding = "2.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7"
toml = "0.9"
url = "2.5"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
