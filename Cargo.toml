[workspace]
members = [
    "crates/proxy-guard-core",
    "crates/proxy-guard-windows",
    "crates/proxy-guard-app",
]
resolver = "2"

[workspace.package]
version = "0.4.1-rc.6"
edition = "2024"
license = "MIT"
# let-chains in appx.rs require 1.88; locked dependencies declare at most
# 1.88 (darling / ratatui / sysinfo).
rust-version = "1.88"
repository = "https://github.com/avrcp/codex-proxy-guard"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = "0.7"
toml = "0.9"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# Official COM bindings for IApplicationActivationManager only (the OS
# implements the interface; Guard never hand-copies its vtable). Everything
# else keeps using windows-sys. CLSCTX_LOCAL_SERVER activation of the
# OS-provided ApplicationActivationManager is the documented path for
# short-lived launchers.
windows = { version = "0.62", default-features = false, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
